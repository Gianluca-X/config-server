spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/dh
  cloud:
    config:
      discovery:
        serviceId: config-service
        enabled: true

  gateway:
   routes:
    - id: checkout-service
      uri: lb://checkout-service
      predicates:
      - Path=/checkout
      filters:
      - AddRequestHeader=X-Request-from, gateway
      - AddResponseHeader=X-Response-Red, blue
  

server:
  port: 8084
  
